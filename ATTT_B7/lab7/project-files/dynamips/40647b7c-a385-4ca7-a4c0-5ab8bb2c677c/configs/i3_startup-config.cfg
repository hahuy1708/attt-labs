!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname east
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$sOqy$XVnTTKaRivjM74DYHv93u/
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
crypto isakmp key vpnpa55 address 172.16.3.1
!
!
crypto ipsec transform-set VPN-SET esp-3des esp-sha-hmac 
!
crypto map VPN-MAP 10 ipsec-isakmp 
 description VPN tunnel to WEST
 set peer 172.16.3.1
 set transform-set VPN-SET 
 match address 110
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.10.3.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 ip address 10.10.4.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 172.16.4.1 255.255.255.0
 clock rate 2000000
 crypto map VPN-MAP
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router rip
 version 2
 network 10.0.0.0
 network 172.16.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
access-list 110 permit ip 10.10.3.0 0.0.0.255 10.10.1.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 password ciscoconpa55
 logging synchronous
 login
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 password ciscovtypa55
 login
!
!
end
