!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname west
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.10.1.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 172.16.3.1 255.255.255.0
 clock rate 2000000
!
interface FastEthernet0/1
 ip address 10.10.2.1 255.255.255.0
 ip access-group ACL_LAN2_LAN3 in
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial1/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router rip
 version 2
 network 10.0.0.0
 network 172.16.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL_LAN2_LAN3
 remark --- Cho phC)p FTP ta;+ LAN2 sang LAN3 ---
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp
 permit tcp 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255 eq ftp-data
 remark --- Cho phC)p FTP ta;+ LAN3 sang LAN2 ---
 permit tcp 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255 eq ftp
 permit tcp 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255 eq ftp-data
 remark --- Cha:7n toC n ba; ka:t na;i khC!c gia;/a LAN2 vC  LAN3 ---
 deny   ip 10.10.2.0 0.0.0.255 10.10.3.0 0.0.0.255
 deny   ip 10.10.3.0 0.0.0.255 10.10.2.0 0.0.0.255
 remark --- Cho phC)p toC n ba; lF0u lF0a;#ng khC!c ---
 permit ip any any
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
